# /etc/nginx/snippets/0trust-surf.conf
# Proxy directives for the /surf visitor proxy upstream.
#
# Separate from 0trust-proxy.conf on purpose. Including that one here and then
# overriding a timeout puts the same directive twice in one location block,
# which nginx rejects outright — so a fresh install ends with nginx refusing
# to start. One snippet per upstream, each the single source of its values.
#
# The differences from the API snippet: fetching somebody else's slow website
# takes longer than an API call, responses are buffered so a slow reader can't
# pin a worker, and the body limit is tiny because /surf only ever sees GETs.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    20s;
proxy_read_timeout    20s;

proxy_buffering on;
proxy_request_buffering on;

client_max_body_size 1k;
