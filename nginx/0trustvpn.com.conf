# /etc/nginx/sites-available/0trustvpn.com
# ============================================================================
# 0trust VPN — Nginx config
# ============================================================================
# - Hardened TLS (1.3 only, modern ciphers)
# - Static site served from /var/www/0trust
# - API proxied to uvicorn on 127.0.0.1:8080
# - Rate limits on account creation + webhook
# - Strict security headers, no referrer, no logging of querystrings
# - Buffered access log strips IP via $remote_addr_anon
# ============================================================================

# IP anonymization map — replace last octet with 0 for logging
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
    ~(?P<ip>[^:]+:[^:]+):       $ip::;
    default                     0.0.0.0;
}

# Two of our paths carry a secret in the path itself, and $uri is the DECODED
# path, so logging it verbatim put them in a file we keep for two days:
#
#   DELETE /api/v1/devices/<the customer's WireGuard public key>
#   GET    /api/v1/payment/<the invoice capability>/status
#
# The invoice id is a bearer capability — /methods and /status are deliberately
# unauthenticated, because the checkout page polls them before the customer has
# any credential — so a log line is enough to read someone's receive address
# and what they owe. Collapse both to the route. Triage wants to know that
# device deletions are 500ing; it has never wanted to know whose.
#
# Everything else logs unchanged. The sibling copy of this leak was uvicorn's
# own access line, fixed in systemd/0trust-api.service with --no-access-log.
map $uri $uri_anon {
    default                          $uri;
    "~^/api/v1/devices/.+$"          /api/v1/devices/-;
    "~^/api/v1/payment/[^/]+/(?<rest>.*)$"  /api/v1/payment/-/$rest;
}

# Anonymized log format (no querystring, no User-Agent fingerprinting,
# no secret-bearing path segment)
log_format anon '$remote_addr_anon - [$time_local] "$request_method $uri_anon" '
                '$status $body_bytes_sent';

# Rate limit zones
limit_req_zone $binary_remote_addr zone=signup:10m   rate=5r/m;    # 5 signups/min/IP
limit_req_zone $binary_remote_addr zone=api:10m      rate=60r/m;   # 60 API calls/min/IP
limit_req_zone $binary_remote_addr zone=webhook:10m  rate=120r/m;  # BTCPay can be chatty
limit_req_zone $binary_remote_addr zone=surf:10m     rate=30r/m;   # visitor proxy
limit_req_zone $binary_remote_addr zone=trial:10m    rate=3r/m;    # free-trial redemption
limit_req_zone $binary_remote_addr zone=admin:10m    rate=120r/m;  # operations dashboard

# The proxy fetches on a stranger's behalf, so cap concurrency per IP as well
# as rate — one visitor should not be able to hold every worker open.
limit_conn_zone $binary_remote_addr zone=surfconn:10m;

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name 0trustvpn.com www.0trustvpn.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://0trustvpn.com$request_uri;
    }
}

# --- Apex HTTPS ---
server {
    # `listen ... http2` rather than the newer standalone `http2 on;`:
    # Ubuntu 24.04 ships nginx 1.24, which does not know that directive and
    # refuses to start. 1.25+ still accepts this form (with a deprecation
    # warning), so one config works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 0trustvpn.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/0trustvpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0trustvpn.com/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Content-Security-Policy. Strict:
    #   - No external script origins (cdnjs removed when we vendored qrcode)
    #   - 'unsafe-inline' on scripts/styles still required because the
    #     landing page, status page, and other static pages embed inline
    #     <style> and <script> blocks. Migration to external files +
    #     SHA/nonce-based CSP is on the roadmap but not blocking.
    #   - There are now NO third-party origins at all. The brand faces are
    #     served from /fonts (scripts/fetch-fonts.sh regenerates them), so
    #     fonts.googleapis.com and fonts.gstatic.com came out of style-src and
    #     font-src. Leaving them whitelisted after nothing uses them would be
    #     attack surface kept for no reason — and on /surf, whose whole pitch
    #     is that your visit is not handed to anybody, asking Google for a
    #     font was the contradiction that prompted this.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # --- Logging (privacy-conscious) ---
    access_log /var/log/nginx/0trust-access.log anon buffer=32k flush=5s;
    error_log  /var/log/nginx/0trust-error.log warn;

    # Don't disclose nginx version
    server_tokens off;

    # --- Static site ---
    root /var/www/0trust;
    index index.html;

    # Hide dotfiles
    location ~ /\. { deny all; }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # --- Status page (no cache; UI polls /api/v1/status/public itself) ---
    location = /status {
        add_header Cache-Control "no-store" always;
        try_files /status.html =404;
    }
    location = /status.html {
        add_header Cache-Control "no-store" always;
    }

    # --- Other static pages with friendly URLs ---
    location = /download         { try_files /download.html =404; }
    location = /help             { try_files /help.html =404; }
    location = /audit            { try_files /audit.html =404; }
    location = /security-policy  { try_files /security-policy.html =404; }
    location = /privacy          { try_files /privacy.html =404; }
    location = /terms            { try_files /terms.html =404; }

    # --- /releases/ — signed binaries, served verbatim ---
    # Long cache because each version is content-addressed by its SHA in
    # SHA256SUMS; a new version always has a new path.
    location /releases/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Force download rather than inline-render binaries
        location ~ /releases/.*/0trust-[^/]*$ {
            add_header Content-Type "application/octet-stream" always;
            add_header Content-Disposition "attachment" always;
        }
    }

    # --- /verify-release.sh — served as text/plain so it can be curl'd safely ---
    location = /verify-release.sh {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- .well-known/security.txt (RFC 9116) ---
    location = /.well-known/security.txt {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # WKD (Web Key Directory) for PGP discovery
    location /.well-known/openpgpkey/ {
        add_header Content-Type "application/octet-stream" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- Vendored third-party JS (pinned + SRI-checked) ---
    # Safe to cache forever because the script tag pins an integrity hash;
    # any update bumps the URL via scripts/vendor-third-party.sh.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Warrant canary (must never be cached, must be human-readable) ---
    location = /canary.txt {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        try_files /canary.txt =404;
    }
    location = /canary.txt.sig {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /canary.txt.sig =404;
    }
    location = /pubkey.asc {
        add_header Content-Type "application/pgp-keys; charset=utf-8" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /pubkey.asc =404;
    }
    location /canary/archive/ {
        add_header Content-Type "text/plain; charset=utf-8" always;
    }

    # --- API proxy ---
    # Note the "=" — exact match, not prefix.
    #
    # As a prefix, /api/v1/account also swallowed /api/v1/account/status, so
    # every status check was charged to the 5-signups-per-minute bucket. The
    # desktop GUI polls status while it's open and would start taking 429s
    # within seconds of launch. Signup and top-up are the calls that mint
    # BTCPay invoices and deserve the tight limit; reading your own status
    # belongs in the general API bucket.
    location = /api/v1/account {
        limit_req zone=signup burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
    }

    location = /api/v1/account/topup {
        limit_req zone=signup burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
    }

    # --- Free trial ---
    # The proof-of-work makes bulk redemption expensive; this makes it slow
    # as well. Challenges are cheap to issue, so only redemption is throttled.
    location = /api/v1/trial {
        limit_req zone=trial burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
    }

    location = /api/v1/payment/webhook {
        limit_req zone=webhook burst=20 nodelay;
        # Optional: restrict to BTCPay server IP
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
    }

    location /api/v1/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
    }

    # --- Visitor proxy ---
    # Separate upstream on purpose: if /surf is being abused you can stop it
    # without touching the control plane that paying customers depend on.
    location /surf {
        limit_req zone=surf burst=10 nodelay;
        limit_conn surfconn 4;
        proxy_pass http://127.0.0.1:8081;
        # Its own snippet, not the API one: overriding a directive that the
        # included file already sets is a duplicate, and nginx refuses to
        # start rather than picking a winner.
        include /etc/nginx/snippets/0trust-surf.conf;

        # Proxied pages are other people's content served from our origin.
        # Belt and braces alongside the CSP the app sets.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /trial {
        try_files /trial.html =404;
    }

    location = /renew {
        try_files /renew.html =404;
    }

    location = /proxy {
        try_files /proxy.html =404;
    }

    location = /crypto-vpn {
        try_files /crypto-vpn.html =404;
    }

    # --- Operations dashboard ---
    # Restricted by default. This page can ban customers and move money, so it
    # is the one part of the site that should not be reachable from the open
    # internet. Replace the allow lines with your own address, or front it with
    # a VPN or an SSH tunnel and leave it on 127.0.0.1.
    location = /admin {
        # allow 203.0.113.7;    # <- your address
        # deny all;
        try_files /admin.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location = /admin.css { try_files /admin.css =404; }
    location = /admin.js  { try_files /admin.js  =404; }

    location /api/v1/admin/ {
        # allow 203.0.113.7;    # <- same restriction as the page itself
        # deny all;
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/0trust-proxy.conf;
        add_header Cache-Control "no-store" always;
    }


    # 404 / 50x
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

# --- www → apex ---
server {
    # `listen ... http2` rather than the newer standalone `http2 on;`:
    # Ubuntu 24.04 ships nginx 1.24, which does not know that directive and
    # refuses to start. 1.25+ still accepts this form (with a deprecation
    # warning), so one config works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.0trustvpn.com;

    ssl_certificate     /etc/letsencrypt/live/0trustvpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/0trustvpn.com/privkey.pem;
    ssl_protocols       TLSv1.3;

    return 301 https://0trustvpn.com$request_uri;
}
